name: Build (Wii)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-wii:
    name: Wii (devkitPPC)
    runs-on: ubuntu-latest
    # Official devkitPro image: devkitPPC toolchain + CMake + pacman preinstalled.
    container:
      image: devkitpro/devkitppc:latest
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC
    steps:
      # NOTE: do NOT use actions/checkout's zip-download codepath (it's fine here since
      # checkout uses git, but per upstream README: never grab a GitHub zip archive of
      # this repo manually, it omits the sibling repos below).
      - name: Checkout xash3d-fwgs (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
          path: xash3d-fwgs

      # The Wii port builds three sibling checkouts side by side:
      #   xash3d-fwgs/  mainui_cpp/  hlsdk-portable/
      # CMakeLists.txt / makelibrary.txt reference the latter two via ../mainui_cpp
      # and ../hlsdk-portable, so they must sit next to this repo, not inside it.
      - name: Checkout mainui_cpp (Wii fork)
        uses: actions/checkout@v6
        with:
          repository: MintFerret/mainui_cpp
          submodules: recursive
          path: mainui_cpp

      - name: Checkout hlsdk-portable (Wii fork)
        uses: actions/checkout@v6
        with:
          repository: MintFerret/hlsdk-portable
          submodules: recursive
          path: hlsdk-portable

      - name: Install devkitPro Wii portlibs
        # NOTE: intentionally no "-Sy" here. devkitpro/devkitppc:latest already
        # installs wii-dev + wii-portlibs + ppc-portlibs at image build time
        # (see https://github.com/devkitPro/docker/blob/master/devkitppc/Dockerfile),
        # which covers everything the Wii README asks for. Forcing a database
        # sync ("-Sy") makes an unnecessary network call to pkg.devkitpro.org,
        # which intermittently 403s shared CI IP ranges
        # (see https://github.com/devkitPro/pacman/issues/63 - unresolved,
        # server-side). Without "-Sy", "--needed" just checks the local DB
        # already baked into the image and no-ops if everything's present,
        # so this step doesn't hit the network at all in the common case.
        run: |
          for i in 1 2 3 4 5; do
            dkp-pacman -S --needed --noconfirm \
              wii-dev wii-sdl2 wii-opengx ppc-bzip2 ppc-freetype ppc-zlib && break
            echo "pacman attempt $i failed, retrying in 15s..."
            sleep 15
          done

      # FIX: library_suffix's build.h does compile-time OS detection and falls
      # back to a bare "#error" for anything it doesn't recognize. Wii/GEKKO
      # isn't in FWGS's upstream platform list at all (confirmed via CI log:
      # the #else/#error catch-all at the end of the OS #if/#elif chain is
      # what's firing), so patch in a branch for it before configuring.
      # devkitPro's CMake toolchain passes -DGEKKO at compile time even though
      # it's not a built-in compiler macro.
      - name: Patch library_suffix for Wii/GEKKO support
        working-directory: xash3d-fwgs
        run: |
          F=3rdparty/library_suffix/include/build.h
          perl -pi -e 's/^(\s*)#undef XASH_WIN32$/$1#undef XASH_WII\n$1#undef XASH_WIN32/' "$F"
          # IMPORTANT: Wii/GEKKO must be a TOP-LEVEL branch, like __psp__ already
          # is, NOT nested inside the "#else // POSIX compatible" block (which
          # sets XASH_POSIX 1). libogc/newlib on Wii has no select()/getaddrinfo()/
          # execv()/getpwuid() etc., so tagging it XASH_POSIX makes CMakeLists.txt
          # pull in engine/platform/posix/*.c alongside the real engine/platform/ogc/*.c
          # files, causing duplicate-symbol link errors (e.g. Platform_ShellExecute
          # defined in both) and unresolved POSIX socket/user syscalls.
          perl -0777 -pi -e 's/(#elif defined __psp__\n(?:.*\n)*?\t#define XASH_PSP 1\n)/$1#elif defined GEKKO || defined __wii__ || defined __gamecube__\n\t#define XASH_WII 1\n/' "$F"
          echo "--- build.h patched section (top-level OS chain) ---"
          nl -ba "$F" | sed -n '1,60p'
          echo "--- build.h patched section (POSIX sub-chain, should NOT contain XASH_WII) ---"
          nl -ba "$F" | sed -n '95,160p'

          # buildenums.h maps each XASH_* platform macro from build.h to a
          # PLATFORM_* integer enum via its own #elif chain + #error catch-all.
          # It doesn't know about XASH_WII either, so give it a slot too.
          F2=3rdparty/library_suffix/include/buildenums.h
          perl -pi -e 's/^(\s*#define PLATFORM_PSP\s+18\s*)$/$1\n#define PLATFORM_WII        19/' "$F2"
          perl -pi -e 's/^(\s*)#define XASH_PLATFORM PLATFORM_PSP$/$1#define XASH_PLATFORM PLATFORM_PSP\n#elif XASH_WII\n$1#define XASH_PLATFORM PLATFORM_WII/' "$F2"
          echo "--- buildenums.h patched section ---"
          nl -ba "$F2" | sed -n '55,105p'

          # library_suffix.h picks a dynamic-library file extension per platform
          # (.so/.dll/.prx) with its own #error catch-all. Doesn't matter that
          # Wii never actually loads dynamic libs (everything's statically
          # linked into one .dol) - it still needs to compile.
          F3=3rdparty/library_suffix/include/library_suffix.h
          perl -pi -e 's/^(\s*)#define OS_LIB_EXT "prx"$/$1#define OS_LIB_EXT "prx"\n#elif XASH_WII\n$1#define OS_LIB_EXT "dol"/' "$F3"
          echo "--- library_suffix.h patched section ---"
          nl -ba "$F3" | sed -n '33,50p'

          # DIAGNOSTIC: figure out exactly what gates engine/platform/posix/*.c
          # and the POSIX-socket code paths, so if removing XASH_POSIX from Wii
          # doesn't fully fix the link, we know precisely what else to patch.
          echo "--- CMakeLists.txt: how platform/posix sources and socket code are gated ---"
          grep -n -B2 -A2 'platform/posix\|XASH_POSIX\|getaddrinfo\|WITH_SOCKETS\|HAVE_SOCKETS' CMakeLists.txt makelibrary.txt engine/common/net_ws.c 2>/dev/null | head -150

          # DIAGNOSTIC: broader context around the two spots that reference
          # engine/platform/posix, to see if there's ANY platform guard around
          # them or if they're unconditional (would explain the duplicate-symbol
          # link errors against engine/platform/ogc/*.c).
          echo "--- CMakeLists.txt lines 90-145 (source globbing / add_executable) ---"
          nl -ba CMakeLists.txt | sed -n '90,145p'

      - name: Configure (CMake)
        working-directory: xash3d-fwgs
        run: |
          cmake -S. -Bbuild -DCMAKE_TOOLCHAIN_FILE="${DEVKITPRO}/cmake/Wii.cmake"

      - name: Build
        working-directory: xash3d-fwgs
        run: make -C build -j"$(nproc)"

      - name: Locate build output
        working-directory: xash3d-fwgs
        run: find build -name '*.dol' -o -name '*.elf'

      - name: Rename xash.dol to boot.dol
        working-directory: xash3d-fwgs
        run: |
          DOL=$(find build -name 'xash.dol' | head -n1)
          if [ -n "$DOL" ]; then
            cp "$DOL" "$(dirname "$DOL")/boot.dol"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: xash3d-fwgs-wii
          path: |
            xash3d-fwgs/build/**/*.dol
            xash3d-fwgs/build/**/*.elf
          if-no-files-found: warn
