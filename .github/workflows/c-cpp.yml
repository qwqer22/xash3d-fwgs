name: Build Xash3D Wii

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        shell: bash
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"
          powerpc-eabi-gcc --version
          powerpc-eabi-g++ --version
          cmake --version
          make --version

      - name: Install dependencies
        shell: bash
        run: |
          pacman -Sy --noconfirm \
            git \
            cmake \
            make \
            pkgconf \
            python \
            freetype2 \
            sdl2 \
            zlib \
            bzip2 \
            opus \
            libogc

      - name: Check devkitPro environment
        shell: bash
        run: |
          echo "========================================"
          echo "devkitPro"
          echo "========================================"

          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"

          ls -la "$DEVKITPRO"
          ls -la "$DEVKITPPC"

          echo "========================================"
          echo "Libraries"
          echo "========================================"

          find "$DEVKITPRO" \
            -maxdepth 3 \
            -type d \
            | sort \
            | head -200

      - name: Check source tree
        shell: bash
        run: |
          echo "========================================"
          echo "Source tree"
          echo "========================================"

          find . \
            -maxdepth 3 \
            -type f \
            | sort \
            | head -500

      - name: Configure
        shell: bash
        run: |
          rm -rf build

          cmake \
            -S . \
            -B build \
            -G "Unix Makefiles" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: bash
        run: |
          cmake --build build --parallel $(nproc)

      - name: Find output
        shell: bash
        run: |
          echo "========================================"
          echo "Build output"
          echo "========================================"

          find build \
            -type f \
            \( \
              -name "*.dol" \
              -o -name "*.elf" \
              -o -name "*.map" \
            \) \
            -print

      - name: Package
        shell: bash
        run: |
          mkdir -p release

          find build \
            -type f \
            \( -name "*.dol" -o -name "*.elf" \) \
            -exec cp {} release/ \;

          cp -r valve release/ 2>/dev/null || true

          echo "========================================"
          echo "Release"
          echo "========================================"

          find release -type f -print

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xash3d-wii
          path: release/
          if-no-files-found: error
