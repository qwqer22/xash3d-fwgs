name: Build Wii

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC
      PATH: /opt/devkitpro/devkitPPC/bin:/opt/devkitpro/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin

    steps:
      - name: Checkout Xash3D
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone dependencies
        run: |
          git clone --recursive https://github.com/MintFerret/mainui_cpp.git mainui_cpp
          git clone --recursive https://github.com/MintFerret/hlsdk-portable.git hlsdk-portable

      - name: Verify dependencies
        run: |
          echo "===== Toolchain ====="
          "$DEVKITPPC/bin/powerpc-eabi-gcc" --version

          echo "===== HLSDK ====="
          test -f hlsdk-portable/cl_dll/ev_hldm.cpp
          test -f hlsdk-portable/dlls/agrunt.cpp

          echo "===== MainUI ====="
          test -f mainui_cpp/link_helper.cpp

          echo "All dependencies OK."

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Wii.cmake" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel 2

      - name: Check output
        run: |
          echo "===== Build output ====="
          find build -type f \
            \( -name "*.dol" -o -name "*.elf" \) \
            -print

      - name: Prepare Wii application
        run: |
          mkdir -p artifact/apps/xash3d

          DOL=$(find build -type f -name "xash.dol" | head -n 1)

          if [ -z "$DOL" ]; then
            echo "ERROR: xash.dol not found"
            exit 1
          fi

          cp "$DOL" artifact/apps/xash3d/boot.dol

      - name: Upload Wii build
        uses: actions/upload-artifact@v4
        with:
          name: xash3d-wii
          path: artifact/
