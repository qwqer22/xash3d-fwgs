name: Build Wii

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build Wii
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install basic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            wget \
            curl \
            git \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip

      - name: Install devkitPro
        run: |
          wget -qO- https://apt.devkitpro.org/install-devkitpro-pacman \
            | sudo dkp-pacman -S -

          sudo dkp-pacman -S --noconfirm \
            devkitPPC \
            wii-dev

      - name: Check devkitPro
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"

          $DEVKITPPC/bin/powerpc-eabi-gcc --version
          test -f "$DEVKITPRO/cmake/Wii.cmake"

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Wii.cmake" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel 2

      - name: Find build output
        run: |
          echo "========== Build files =========="
          find build -type f \( \
            -name "*.dol" \
            -o -name "*.elf" \
            -o -name "*.map" \
          \) -print

      - name: Prepare artifact
        run: |
          mkdir -p artifact

          DOL=$(find build -type f -name "xash.dol" | head -n 1)

          if [ -z "$DOL" ]; then
            echo "ERROR: xash.dol was not found!"
            exit 1
          fi

          cp "$DOL" artifact/boot.dol

          echo "========== Artifact =========="
          ls -lh artifact/

      - name: Upload Wii build
        uses: actions/upload-artifact@v4
        with:
          name: xash3d-wii
          path: artifact/
