name: Build Wii

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitppc:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show toolchain
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITPPC=$DEVKITPPC"

          powerpc-eabi-gcc --version
          cmake --version

      - name: Install dependencies
        run: |
          dkp-pacman -Syu --noconfirm

          dkp-pacman -S --needed --noconfirm \
            wii-dev \
            wii-sdl2 \
            wii-opengx \
            ppc-bzip2 \
            ppc-freetype \
            ppc-zlib

      - name: Configure
        run: |
          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Wii.cmake" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --parallel 2

      - name: Check output
        run: |
          find build -type f \
            \( -name "*.dol" -o -name "*.elf" \) \
            -print

      - name: Prepare Wii application
        run: |
          mkdir -p artifact/apps/xash3d

          DOL=$(find build -type f -name "xash.dol" | head -n 1)

          if [ -z "$DOL" ]; then
            echo "ERROR: xash.dol not found"
            exit 1
          fi

          cp "$DOL" artifact/apps/xash3d/boot.dol

      - name: Upload Wii build
        uses: actions/upload-artifact@v4
        with:
          name: xash3d-wii
          path: artifact/
